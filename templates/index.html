<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fashion-MNIST Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    h2 { margin-bottom: 16px; }
    #preview { width: 140px; height: 140px; object-fit: contain; border: 1px solid #ccc;
               margin-top: 12px; display: none; image-rendering: pixelated; }
    #result { margin-top: 16px; }
    .bar { background: #eee; border-radius: 4px; margin: 6px 0; overflow: hidden; }
    .fill { background: #4f7cff; color: #fff; padding: 4px 8px; font-size: 14px; white-space: nowrap; }
    #pred { font-size: 20px; font-weight: 600; }
  </style>
</head>
<body>
  <h2>Fashion-MNIST Classifier</h2>

  <input type="file" id="file" accept="image/*">
  <label style="display:block;margin-top:8px">
    <input type="checkbox" id="invert"> Invert (for white backgrounds)
  </label>

  <img id="preview" alt="preview">
  <div id="result"></div>

  <script>
    const fileEl = document.getElementById("file");
    const invEl = document.getElementById("invert");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");

    async function classify() {
      const f = fileEl.files[0];
      if (!f) return;

      preview.src = URL.createObjectURL(f);
      preview.style.display = "block";

      const fd = new FormData();
      fd.append("file", f);
      fd.append("invert", invEl.checked);

      result.textContent = "Predicting...";
      try {
        const r = await fetch("/predict", { method: "POST", body: fd });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "request failed");

        result.innerHTML = `<div id="pred">${data.prediction}</div>` +
          data.top3.map(t => {
            const pct = (t.prob * 100).toFixed(1);
            return `<div class="bar"><div class="fill" style="width:${Math.max(pct, 12)}%">
                      ${t.label} ${pct}%</div></div>`;
          }).join("");
      } catch (err) {
        result.textContent = "Error: " + err.message;
      }
    }

    fileEl.onchange = classify;
    invEl.onchange = classify;
  </script>
</body>
</html>
